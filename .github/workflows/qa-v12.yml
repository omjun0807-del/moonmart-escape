name: v1.2 Immersive Mode QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/qa-v12.mjs'
      - '.github/workflows/qa-v12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test v1.2 production site
        run: node tests/qa-v12.mjs
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonmart-v12-screenshots
          path: v12-qa-*.png
          if-no-files-found: ignore
