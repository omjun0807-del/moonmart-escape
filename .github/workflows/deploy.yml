name: Deploy MOON MART escape
on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'index.html'
      - 'theme-v4.css'
      - 'v09-world.js'
      - 'v09-world.css'
      - 'v10-experience.js'
      - 'v10-experience.css'
      - 'v11-aligned.js'
      - 'v11-aligned.css'
      - 'v12-immersive.js'
      - 'v12-immersive.css'
      - 'v13-playable-focus.js'
      - 'v13-playable-focus.css'
      - 'art-v12/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build latest version, with safe fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _old _site
          base_zip="$(find . -maxdepth 1 -type f -name '*v0.3*.zip' -print -quit)"
          if [[ -z "$base_zip" ]]; then
            echo "::error::이전 버전 기본 리소스 ZIP이 없습니다."
            exit 1
          fi
          unzip -q "$base_zip" -d _old
          base="_old/MOON_MART_v0.3"
          for file in theme-v2.css theme-v3.css assets/scene-shop.webp; do
            test -s "$base/$file" || { echo "::error::v0.3 기본 자료 누락: $file"; exit 1; }
          done
          next_zip="$(find . -maxdepth 1 -type f -name '*v0.8*.zip' -print -quit)"
          if [[ -n "$next_zip" ]]; then
            echo "MOON MART v0.8 게임 전용 일러스트 배포"
            unzip -q "$next_zip" -d _site
            for file in index.html art-v08/shop.svg art-v08/storage.svg art-v08/office.svg; do
              test -s "_site/$file" || { echo "::error::v0.8 ZIP 내부 파일 누락: $file"; exit 1; }
            done
            cp "$base/theme-v2.css" "$base/theme-v3.css" _site/
            cp theme-v4.css _site/
          else
            echo "v0.8 ZIP 미등록 — 기존 v0.7 게임을 안전하게 유지합니다."
            cp "$base/index.html" "$base/theme-v2.css" "$base/theme-v3.css" _site/
            cp -R "$base/assets" _site/assets
            if [[ -f index.html && -f theme-v4.css ]]; then
              cp index.html theme-v4.css _site/
            fi
            if [[ -f v07-photo.js && -f v07-photo.css ]]; then
              cp v07-photo.js v07-photo.css _site/
            fi
          fi
          # v0.9 is additive: the v0.8 ZIP remains the unmodified base.
          if [[ -f v09-world.js && -f v09-world.css && -f _site/art-v08/shop.svg ]]; then
            cp v09-world.js v09-world.css _site/
            node --check _site/v09-world.js
            python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          assert '</head>' in html and '</body>' in html, 'Invalid game document'
          assert 'id="sceneCamera"' in html and '__moonMartTest' in html, 'v0.9 integration points missing'
          html=html.replace('</head>', '<link rel="stylesheet" href="v09-world.css?v=09"></head>', 1)
          html=html.replace('</body>', '<script defer src="v09-world.js?v=09"></script></body>', 1)
          html=html.replace('EP.01 · v0.8','EP.01 · v0.9')
          html=html.replace('Illustrated Interactive Rooms v0.8','Interactive Environments v0.9')
          p.write_text(html,encoding='utf-8')
          for filename in ['art-v08/shop.svg','art-v08/storage.svg','art-v08/office.svg','v09-world.js','v09-world.css']:
              assert (Path('_site')/filename).stat().st_size > 100
          print('MOON MART v0.9 stateful world overlay validated and included')
          PY
          fi
          # v1.0 RC: original illustrated close-ups and a save-aware case journal.
          if [[ -f v10-experience.js && -f v10-experience.css && -f _site/v09-world.js ]]; then
            cp v10-experience.js v10-experience.css _site/
            node --check _site/v10-experience.js
            python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          content = p.read_text(encoding='utf-8')
          assert 'v09-world.js' in content, 'v0.9 environment not included'
          assert '<div id="dialogBody"' not in content or 'id="dialogBody"' in content
          assert 'id="dialogBody"' in content and 'id="missionPanel"' in content and '__moonMartTest' in content
          content = content.replace('</head>', '<link rel="stylesheet" href="v10-experience.css?v=10"></head>', 1)
          content = content.replace('</body>', '<script defer src="v10-experience.js?v=10"></script></body>', 1)
          content = content.replace('Illustrated Interactive Rooms v0.8','Cinematic Inspection v1.0 RC')
          p.write_text(content, encoding='utf-8')
          assert content.count('v10-experience.js') == 1
          print('MOON MART v1.0 RC: close-ups + story journal included')
          PY
          fi
          # v1.1: replace misaligned v0.9 world drawings with hotspot-anchored props.
          if [[ -f v11-aligned.js && -f v11-aligned.css && -f _site/v10-experience.js ]]; then
            cp v11-aligned.js v11-aligned.css _site/
            node --check _site/v11-aligned.js
            python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          html = p.read_text(encoding='utf-8')
          for anchor in ['id="hotspots"', 'id="sceneCamera"', 'v09-world.js', 'v10-experience.js']:
            assert anchor in html, f'Missing v1.1 integration target: {anchor}'
          html = html.replace('</head>', '<link rel="stylesheet" href="v11-aligned.css?v=11"></head>', 1)
          html = html.replace('</body>', '<script defer src="v11-aligned.js?v=11"></script></body>', 1)
          assert html.count('v11-aligned.js') == 1
          p.write_text(html, encoding='utf-8')
          print('v1.1 anchored state props included: '+str(p.stat().st_size)+' bytes')
          PY
          fi
          # v1.2: cinematic scene focus mode; optional art only if all three validated files are available.
          if [[ -f v12-immersive.js && -f v12-immersive.css && -f _site/v11-aligned.js ]]; then
            cp v12-immersive.js v12-immersive.css _site/
            node --check _site/v12-immersive.js
            if [[ -s art-v12/shop.webp && -s art-v12/storage.webp && -s art-v12/office.webp ]]; then
              mkdir -p _site/art-v12
              cp art-v12/*.webp _site/art-v12/
            fi
            python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          for anchor in ['v11-aligned.js','id="sceneArt"','id="soundBtn"','id="scene"']:
              assert anchor in html, f'Missing v1.2 integration point: {anchor}'
          if all((Path('_site')/'art-v12'/f'{zone}.webp').stat().st_size > 20000 for zone in ['shop','storage','office']) if (Path('_site')/'art-v12').exists() else False:
              html=html.replace('</head>','<meta name="mm-v12-art" content="ready"></head>',1)
          html=html.replace('</head>','<link rel="stylesheet" href="v12-immersive.css?v=12"></head>',1)
          html=html.replace('</body>','<script defer src="v12-immersive.js?v=12"></script></body>',1)
          assert html.count('v12-immersive.js')==1
          p.write_text(html,encoding='utf-8')
          print('MOON MART v1.2 immersion mode added, available artwork checked')
          PY
          fi
          # v1.3: keep inventory, exploration and hints playable in immersive mode.
          test -s v13-playable-focus.js
          test -s v13-playable-focus.css
          test -s _site/v12-immersive.js
          cp v13-playable-focus.js v13-playable-focus.css _site/
          node --check _site/v13-playable-focus.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          for anchor in ('id="inventory"','id="hintPanel"','id="scene"','v12-immersive.js'):
              assert anchor in html, f'Missing v1.3 dependency: {anchor}'
          html=html.replace('</head>','<link rel="stylesheet" href="v13-playable-focus.css?v=13"></head>',1)
          html=html.replace('</body>','<script defer src="v13-playable-focus.js?v=13"></script></body>',1)
          assert html.count('v13-playable-focus.js')==1
          p.write_text(html, encoding='utf-8')
          print('v1.3 full-focus controls and backup manager deployed')
          PY
          touch _site/.nojekyll
          echo "배포 확인:"
          find _site -maxdepth 2 -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
