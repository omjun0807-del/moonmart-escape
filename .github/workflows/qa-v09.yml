name: v0.9 Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/qa-v09.mjs'
      - '.github/workflows/qa-v09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test published v0.9 on desktop and mobile
        run: node tests/qa-v09.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonmart-v09-qa-screenshots
          path: v09-qa-*.png
          if-no-files-found: ignore
